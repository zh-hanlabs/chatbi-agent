spring:
  application:
    name: chatbi-agent
  datasource:
    url: jdbc:mysql://localhost:3306/chatbi_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${CHATBI_DB_USER:chatbi}
    password: ${CHATBI_DB_PASSWORD:chatbi}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${CHATBI_REDIS_HOST:localhost}
      port: ${CHATBI_REDIS_PORT:6379}

chatbi:
  # OpenAI 兼容网关(GLM/DeepSeek/Qwen 等);api-key 为空时全部回退本地规则实现
  llm:
    base-url: ${CHATBI_LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: ${CHATBI_LLM_API_KEY:}
    chat-model: ${CHATBI_LLM_CHAT_MODEL:glm-4-flash}
    embedding-model: ${CHATBI_LLM_EMBEDDING_MODEL:embedding-3}
    timeout-seconds: 10
  cache:
    # redis: 生产/联调;memory: 本地无 Redis 或测试时的进程内兜底
    type: ${CHATBI_CACHE_TYPE:redis}
    ttl-seconds: 300
  rag:
    top-k: 3
    # 低于该相似度拒答,不编造内容
    min-score: 0.2
  context:
    # 历史消息超过该条数触发压缩
    compress-threshold: 10
    # 压缩后保留的最近消息条数
    keep-recent: 6

server:
  port: 8080
